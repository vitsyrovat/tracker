<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Time Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Confirmation modal -->
    <div id="confirm-modal" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <p id="modal-title" class="modal-message">An activity is already running. Are you sure you want to start another one?</p>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-modal btn-modal-cancel">Cancel</button>
                <button id="modal-ok" class="btn-modal btn-modal-ok">Start anyway</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
